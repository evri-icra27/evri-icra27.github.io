site:
  name: EVRI · ICRA 2027
  site: 'https://evri-icra27.github.io'
  base: '/'
  trailingSlash: false
  googleSiteVerificationId: false

# Default SEO metadata
metadata:
  title:
    default: Event-Based Vision for Real-World Robotics
    template: '%s — EVRI · ICRA 2027'
  description: 'Event-Based Vision for Real-World Robotics: From Perception to Embodied Intelligence. A proposed full-day workshop at ICRA 2027, bringing together event-based perception and embodied AI.'
  robots:
    index: true
    follow: true
  openGraph:
    site_name: EVRI · ICRA 2027
    images: []
    type: website
  twitter:
    cardType: summary

i18n:
  language: en
  textDirection: ltr

apps:
  blog:
    isEnabled: false
    postsPerPage: 8

    post:
      isEnabled: true
      permalink: '/%slug%' # Variables: %slug%, %year%, %month%, %day%, %hour%, %minute%, %second%, %category%
      robots:
        index: true

    list:
      isEnabled: true
      pathname: 'blog' # Blog main path, you can change this to "articles" (/articles)
      robots:
        index: true

    category:
      isEnabled: true
      pathname: 'category' # Category main path /category/some-category, you can change this to "group" (/group/some-category)
      robots:
        index: true

    tag:
      isEnabled: true
      pathname: 'tag' # Tag main path /tag/some-tag, you can change this to "topics" (/topics/some-category)
      robots:
        index: false

    isRelatedPostsEnabled: true
    relatedPostsCount: 4

analytics:
  vendors:
    googleAnalytics:
      id: null # or "G-XXXXXXXXXX"

ui:
  theme: 'system' # Values: "system" | "light" | "dark" | "light:only" | "dark:only"
